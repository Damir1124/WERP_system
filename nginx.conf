# Конфигурация Nginx для WERP / Osnova 2.0 — продакшен (docker-сеть)
# Терминирует SSL, раздаёт статику/медиа, проксирует HTTP/WebSocket/Webhook.
#
# ВНИМАНИЕ: замени YOUR_DOMAIN на реальный домен перед получением сертификата
# (см. README/деплой-док: certbot --nginx -d YOUR_DOMAIN).
# Шаблон: docker compose конфиги → сервисы по именам (web, web-asgi, bot).

# Редирект HTTP → HTTPS (и acme-challenge для Let's Encrypt)
server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Хук для получения/обновления сертификата certbot (--webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной сервер (HTTPS)
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # SSL-сертификаты — пути после certbot. Замени YOUR_DOMAIN:
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Статика Django (включая собранные Mini App) — Nginx раздаёт напрямую
    location /static/ {
        alias /staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Медиафайлы (контракты, фото товаров)
    location /media/ {
        alias /media/;
    }

    # Health-check для мониторинга (без авторизации)
    location = /health/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSockets (Django Channels / живой Dashboard) → ASGI-сервер (Uvicorn)
    location /ws/ {
        proxy_pass http://web-asgi:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Telegram webhook → бот (aiohttp, порт 8001 в контейнере bot)
    location /webhook {
        proxy_pass http://bot:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Все остальные запросы → Django (Gunicorn, WSGI)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}