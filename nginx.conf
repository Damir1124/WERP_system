# Конфигурация Nginx для WERP / Osnova 2.0
# Терминирует SSL, раздаёт статику/медиа, проксирует HTTP и WebSocket на Django.

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной сервер (HTTPS)
server {
    listen 443 ssl;
    server_name _;

    # SSL-сертификаты (заполнить после certbot)
    ssl_certificate     /etc/letsencrypt/live/werp.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/werp.uz/privkey.pem;

    # Статика Django (включая собранные Mini App)
    location /static/ {
        alias /staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Медиафайлы (контракты, фото товаров)
    location /media/ {
        alias /media/;
    }

    # WebSockets (Django Channels) — проксируем с апгрейдом
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Все остальные запросы → Django (Gunicorn)
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}