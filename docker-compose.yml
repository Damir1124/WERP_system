# WERP / Osnova 2.0 — Docker Compose.
# Поле version удалено: оно устарело (obsolete) начиная со Compose v2 и
# вызывало предупреждение «the attribute `version` is obsolete».
services:
  db:
    image: postgres:17
    container_name: werp_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: werp_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: werp_web
    restart: always
    command: gunicorn WERP_system.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-asgi:
    # ASGI-сервер (Uvicorn) для Django Channels / WebSockets (живой Dashboard).
    # Gunicorn (web) НЕ умеет WebSocket-апгрейды, поэтому отдельный процесс.
    build: .
    container_name: werp_web_asgi
    restart: always
    command: uvicorn WERP_system.asgi:application --host 0.0.0.0 --port 8001 --workers 2
    env_file:
      - .env
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    container_name: werp_celery_worker
    restart: always
    command: celery -A WERP_system worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: werp_celery_beat
    restart: always
    command: celery -A WERP_system beat --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    # Telegram-бот (aiogram). В продакшене webhook-режим; принимает апдейты
    # от Nginx на /webhook (порт 8001 внутри сети).
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: werp_bot
    restart: always
    env_file:
      - .env
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: werp_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/staticfiles:ro
      - ./media:/media:ro
      - ./certbot_conf:/etc/letsencrypt:ro
      - ./certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - web-asgi

volumes:
  pgdata: