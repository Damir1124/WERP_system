version: '3.8'

services:
  db:
    image: postgres:17
    container_name: werp_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: werp_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: